<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ceviche</title>
    <link rel="stylesheet" href="./host.css" />
  </head>
  <body>
    <header class="bar">
      <h1>Ceviche</h1>
      <button id="inspect" class="toggle" aria-pressed="false" title="Toggle click-to-inspect (I)">⌖ Inspect</button>
      <label title="Cross-origin loads the frame from the other loopback host name, to exercise origin checks">Frame
        <select id="origin">
          <option value="same">Same origin</option>
          <option value="cross">Cross origin</option>
        </select>
      </label>
      <button id="reload">Reload frame</button>
      <span id="status" class="status">Waiting for frame…</span>
    </header>

    <main class="layout">
      <section class="stage">
        <iframe id="frame" title="Inspected page"></iframe>
      </section>

      <aside class="panel" aria-labelledby="target-title">
        <header class="panel-head">
          <h2 id="target-title">No target</h2>
          <span id="element" class="tag"></span>
        </header>

        <p id="empty" class="empty">Turn on <strong>Inspect</strong> and click an element in the frame to see its variables.</p>

        <div id="target" class="panel-body" hidden>
          <section class="block">
            <label class="field">
              <span class="field-label">Target</span>
              <select id="paths" title="Select a target by path (target:select)"></select>
            </label>
            <div class="field">
              <span class="field-label">Path</span>
              <code id="path" class="mono"></code>
            </div>
          </section>

          <section class="block">
            <h3 class="block-title">Variables <span id="variable-count" class="count"></span></h3>
            <dl id="variables" class="vars"></dl>
            <p id="no-variables" class="empty small" hidden>No CSS variables used by this target.</p>
          </section>
        </div>
      </aside>
    </main>

    <script type="module" src="./host.ts"></script>
  </body>
</html>
